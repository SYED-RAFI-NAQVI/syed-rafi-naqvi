name: README build

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 4 * * *" # Runs daily at 04:00 UTC
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'cache/requirements.txt'

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update README & Stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: "SYED-RAFI-NAQVI"
        run: python today.py

      - name: Commit and push changes
        run: |-
          git config --global user.name "GitHub-Actions-Bot"
          git config --global user.email "actions@github.com"
          git add dark.svg light.svg
          git diff --staged --quiet || (git commit -m "chore: auto-update GitHub stats [skip ci]" && git push)
